<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Contact Us</title>
        <style>
            body {
                font-family:
                    -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                color: #1f2937;
                line-height: 1.5;
                max-width: 32rem;
                margin: 3rem auto;
                padding: 0 1rem;
            }

            label {
                display: block;
                font-weight: 600;
                margin-top: 1rem;
            }

            input,
            textarea {
                display: block;
                width: 100%;
                box-sizing: border-box;
                padding: 0.5rem;
                margin-top: 0.25rem;
                border: 1px solid #d1d5db;
                border-radius: 0.375rem;
                font: inherit;
            }

            [aria-invalid="true"] {
                border-color: #dc2626;
            }

            .field-error {
                color: #dc2626;
                font-size: 0.875rem;
                margin: 0.25rem 0 0;
            }

            button {
                margin-top: 1.5rem;
                padding: 0.5rem 1.25rem;
                border: 0;
                border-radius: 0.375rem;
                background: #2563eb;
                color: #fff;
                font: inherit;
                cursor: pointer;
            }

            button:disabled {
                opacity: 0.6;
                cursor: wait;
            }

            .status {
                margin-top: 1.5rem;
                padding: 0.75rem 1rem;
                border-radius: 0.375rem;
            }

            .status[hidden] {
                display: none;
            }

            .status.success {
                background: #dcfce7;
                color: #166534;
            }

            .status.error {
                background: #fee2e2;
                color: #991b1b;
            }

            /* Keeps the honeypot out of sight for people while bots still find it in the markup. */
            .hp {
                position: absolute;
                left: -10000px;
                width: 1px;
                height: 1px;
                overflow: hidden;
            }
        </style>
    </head>

    <body>
        <h1>Contact Us</h1>

        <!--
        Example of posting to the public submission endpoint, POST /api/v1/forms/{form}/submissions.

        The form's schema must accept the input names used here (name, email, message): either use them as
        field IDs, or set each field's "name" to them. See docs/prds/forms.md and docs/prds/form-entries.md.

        If the form restricts submissions with settings.domains, serve this page from one of those domains;
        a page opened straight from disk (file://) sends no Referer header and is rejected with 403.
    -->
        <form id="contact-form" novalidate>
            <!--
            Honeypot: set name and id to the form's settings.honeypot_name (returned in the form's settings once the
            honeypot is enabled). People never see or fill it in; bots that fill in every input trip it, and the API
            still answers with success but stores the entry as spam and sends no alerts. If the form has no
            honeypot, the API drops this unknown field, so it is safe to leave in.
        -->
            <div class="hp" aria-hidden="true">
                <label for="YOUR_HONEYPOT_NAME">Leave this field empty</label>
                <input
                    id="YOUR_HONEYPOT_NAME"
                    name="YOUR_HONEYPOT_NAME"
                    type="text"
                    tabindex="-1"
                    autocomplete="off"
                />
            </div>

            <label for="name">Name</label>
            <input
                id="name"
                name="01M3W9FEBYZ1NJYPYYSMFN1D3Q"
                type="text"
                autocomplete="name"
                required
            />

            <label for="email">Email</label>
            <input
                id="email"
                name="01M3W9FQ9BTQ0MTPBD90VRH5BT"
                type="email"
                autocomplete="email"
                required
            />

            <label for="message">Message</label>
            <textarea
                id="message"
                name="01M3W9FWKWA1EYJPKCERM5J181"
                rows="6"
                required
            >
            </textarea>

            <button type="submit">Send</button>
        </form>

        <div
            id="form-status"
            class="status"
            role="status"
            aria-live="polite"
            hidden
        ></div>

        <script>
            (function () {
                /**
                 * Point these at your API and form.
                 */
                const API_URL = "http://127.0.0.1:8000";
                const FORM_ID = "YOUR_FORM_ID";
                const DEFAULT_SUCCESS_MESSAGE =
                    "Thanks! Your message has been sent.";

                const form = document.getElementById("contact-form");
                const status = document.getElementById("form-status");
                const submitButton = form.querySelector(
                    'button[type="submit"]',
                );
                const endpoint = `${API_URL}/api/v1/forms/${encodeURIComponent(FORM_ID)}/submissions`;

                form.addEventListener("submit", async (event) => {
                    event.preventDefault();
                    clearErrors();
                    showStatus("", null);
                    submitButton.disabled = true;

                    try {
                        const response = await fetch(endpoint, {
                            method: "POST",
                            headers: {
                                Accept: "application/json",
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify(
                                Object.fromEntries(new FormData(form)),
                            ),
                        });
                        const body = await response.json().catch(() => ({}));

                        if (response.status === 201) {
                            handleSuccess(body.data ?? {});
                        } else if (response.status === 422) {
                            showFieldErrors(body.errors ?? {});
                            showStatus(
                                "Please fix the highlighted fields.",
                                "error",
                            );
                        } else if (response.status === 429) {
                            showStatus(
                                "Too many submissions. Please wait a minute and try again.",
                                "error",
                            );
                        } else {
                            // 403 (form inactive or domain not allowed), 404 (unknown form) and anything unexpected.
                            showStatus(
                                body.message ??
                                    "Something went wrong. Please try again later.",
                                "error",
                            );
                        }
                    } catch (error) {
                        showStatus(
                            "Could not reach the server. Check your connection and try again.",
                            "error",
                        );
                    } finally {
                        submitButton.disabled = false;
                    }
                });

                /**
                 * The API never sends a 3XX: it returns the form's redirect and message settings and leaves it to the page.
                 */
                function handleSuccess({ redirect, message }) {
                    if (redirect) {
                        window.location.assign(redirect);

                        return;
                    }

                    form.reset();
                    form.hidden = true;
                    showStatus(message || DEFAULT_SUCCESS_MESSAGE, "success");
                }

                /**
                 * Validation errors are keyed by input name, e.g. { "email": ["The email field must be a valid email address."] }.
                 * Errors for inputs not on this page (a schema field the page is missing) are shown in the status box.
                 */
                function showFieldErrors(errors) {
                    const unmatched = [];

                    for (const [name, messages] of Object.entries(errors)) {
                        const input = form.elements.namedItem(name);

                        if (!(input instanceof HTMLElement)) {
                            unmatched.push(...messages);
                            continue;
                        }

                        const errorId = `${input.id || name}-error`;
                        const message = document.createElement("p");
                        message.className = "field-error";
                        message.id = errorId;
                        message.textContent = messages[0];

                        input.setAttribute("aria-invalid", "true");
                        input.setAttribute("aria-describedby", errorId);
                        input.insertAdjacentElement("afterend", message);
                    }

                    form.querySelector('[aria-invalid="true"]')?.focus();

                    if (unmatched.length > 0) {
                        showStatus(unmatched.join(" "), "error");
                    }
                }

                function clearErrors() {
                    form.querySelectorAll(".field-error").forEach((element) =>
                        element.remove(),
                    );
                    form.querySelectorAll("[aria-invalid]").forEach((input) => {
                        input.removeAttribute("aria-invalid");
                        input.removeAttribute("aria-describedby");
                    });
                }

                function showStatus(text, type) {
                    status.textContent = text;
                    status.className = type ? `status ${type}` : "status";
                    status.hidden = !text;
                }
            })();
        </script>
    </body>
</html>
